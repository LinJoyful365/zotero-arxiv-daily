zotero:
  user_id: null
  api_key: null
  include_path: null
  ignore_path: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY,null}
    base_url: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  generation_kwargs:
    max_tokens: 4096
    model: ${oc.env:OPENAI_MODEL,gpt-4o-mini}
  language: Chinese

source:
  arxiv:
    category: ["cs.AI", "cs.LG", "cs.CV", "cs.RO", "cs.CL"]
    include_cross_list: true

executor:
  debug: ${oc.env:DEBUG,null}
  send_empty: false
  max_paper_num: 20
  source: ["arxiv"]
  use_zotero: false
  interest_topics:
    - WAM / World Action Model
    - action-conditioned world models for embodied agents
    - world models for robotics and embodied AI
    - embodied agents that learn from vision-language-action data
    - robot learning, robot manipulation, and planning with learned world models
    - LLM agents grounded in perception, action, tools, or environments
  interest_keywords:
    - WAM
    - world action model
    - world action models
    - world model
    - world models
    - action-conditioned world model
    - action conditioned world model
    - embodied AI
    - embodied artificial intelligence
    - embodied agent
    - embodied agents
    - embodied learning
    - robot learning
    - robotic learning
    - robot manipulation
    - vision-language-action
    - vision language action
    - VLA
    - LLM agent
    - LLM agents
    - language model agent
    - language model agents
    - agentic
    - multi-agent
  require_interest_match: false
  llm_relevance_filter: true
  llm_relevance_min_score: 7
  llm_relevance_max_candidates: 50
  llm_relevance_preview_chars: 6000
  reranker: local
  generate_tldr: true
  generate_affiliations: false
